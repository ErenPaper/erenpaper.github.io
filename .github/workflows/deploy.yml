name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Rebuild every 2 hours so the Trakt / Letterboxd watch lists refresh on their own.
  # (GitHub can delay scheduled runs, so the real gap is sometimes longer.)
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/fetch-letterboxd.mjs
      - run: node scripts/fetch-letterboxd-watchlist.mjs
      - run: node scripts/fetch-trakt.mjs
        env:
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
      # Google Fonts is fetched at build time and occasionally fails; retry so one
      # blip doesn't skip a deploy.
      - name: Build (retry on transient font fetch failures)
        run: |
          n=0
          until npm run build; do
            n=$((n+1))
            if [ "$n" -ge 3 ]; then echo "build failed after $n attempts"; exit 1; fi
            echo "build failed, retrying ($n/3)..."
            sleep 20
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
